<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Chicago Fire FC — Commemorative Ticket</title>
<!-- Start fetching the header font right away, so the welcome headline doesn't flash in a different font. -->
<link rel="preload" href="assets/fonts/mls-tifo-headline-bold.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/mls-tifo-standard-regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Nothing on this page is ever written to localStorage/sessionStorage/IndexedDB/cookies.
     All state lives in memory (see js/app.js) and disappears on reload by design. -->

<div id="app">

  <!-- ============ Screen 0: config load error ============ -->
  <section id="screen-error" class="screen" hidden>
    <div class="error-box">
      <h1>Ticket unavailable</h1>
      <p id="error-message">We couldn't load this match's info right now. Please try again in a bit.</p>
    </div>
  </section>

  <!-- ============ Screen 1: welcome ============ -->
  <section id="screen-welcome" class="screen" data-active>
    <div class="welcome-content">
      <img class="crest-hero" src="assets/fire-crest.svg" alt="Chicago Fire FC crest">
      <h1>Make a Digital Keepsake Ticket</h1>
      <p id="welcome-subtitle" class="welcome-subtitle"></p>
      <button id="btn-start" class="btn btn-primary" type="button">Start</button>
    </div>
  </section>

  <!-- ============ Screen 2: photo upload ============ -->
  <section id="screen-upload" class="screen">
    <div class="step-content step-centered">
      <h2>Add a Photo from the Match</h2>

      <div id="upload-preview-wrap" class="upload-preview-wrap">
        <img id="upload-preview" alt="" hidden>
        <div id="upload-placeholder" class="upload-placeholder">No Photo Selected</div>
      </div>

      <p id="upload-error" class="field-error" role="alert" hidden></p>

      <!-- No `capture` attribute here on purpose: on iOS Safari/WebView, `capture="environment"`
           forces the camera open directly and skips the OS picker entirely. Without it, tapping
           this input shows the standard action sheet (Photo Library, Take Photo, ...), so the
           library is offered as a choice rather than being bypassed. -->
      <input id="file-input" type="file" accept="image/png,image/jpeg,image/webp,image/heic,image/heif" hidden>

      <!-- One primary button does double duty: "Upload Photo" until a photo is chosen, then "Next"
           (see syncUploadControls in js/app.js). "Choose a Different Photo" appears under it once
           there's a photo; "Skip" is only offered while there isn't one. -->
      <div class="stack">
        <button id="btn-choose-photo" class="btn btn-primary" type="button">Upload Photo</button>
        <button id="btn-change-photo" class="btn btn-secondary" type="button" hidden>Choose a Different Photo</button>
        <button id="btn-upload-skip" class="btn btn-link" type="button">Skip</button>
      </div>
    </div>
  </section>

  <!-- ============ Screen 3: section / row / seat ============ -->
  <section id="screen-seat" class="screen">
    <div class="step-content step-centered">
      <div class="step-center-block">
        <h2>Add Your Seat</h2>
        <p class="step-hint"><em>Optional</em></p>

        <form id="seat-form" class="seat-form" novalidate>
          <label class="seat-field">
            <span>Section</span>
            <input id="input-section" name="section" type="text" maxlength="10" autocomplete="off" inputmode="text">
          </label>
          <label class="seat-field">
            <span>Row</span>
            <input id="input-row" name="row" type="text" maxlength="10" autocomplete="off" inputmode="text">
          </label>
          <label class="seat-field">
            <span>Seat</span>
            <input id="input-seat" name="seat" type="text" maxlength="10" autocomplete="off" inputmode="text">
          </label>
        </form>
        <p id="seat-error" class="field-error" role="alert" hidden></p>
      </div>

      <div class="step-nav">
        <button id="btn-seat-next" class="btn btn-secondary" type="button">Make My Ticket</button>
        <button id="btn-seat-skip" class="btn btn-link" type="button">Skip</button>
      </div>
    </div>
  </section>

  <!-- ============ Screen 4: loading ============ -->
  <section id="screen-loading" class="screen">
    <div class="loading-content">
      <div class="progress-track"><div id="progress-fill" class="progress-fill"></div></div>
      <p>Making your ticket…</p>
    </div>
  </section>

  <!-- ============ Screen 5: preview & share ============ -->
  <section id="screen-preview" class="screen">
    <div class="preview-content">
      <canvas id="ticket-canvas"></canvas>
      <p id="share-error" class="field-error" role="alert" hidden></p>
      <div class="preview-actions">
        <div class="preview-buttons">
          <button id="btn-share" class="btn btn-primary" type="button" hidden>Share</button>
          <button id="btn-save" class="btn btn-secondary" type="button">Save Image</button>
        </div>
        <button id="btn-restart" class="btn btn-link" type="button">Make Another</button>
      </div>
    </div>
  </section>

</div>

<!-- iOS fallback for "Save Image" when the share sheet isn't available: shows the ticket full screen so it
     can be touched-and-held and saved to Photos (see onSave in js/app.js). -->
<div id="save-overlay" class="save-overlay" hidden role="dialog" aria-modal="true" aria-label="Save your ticket">
  <p>Touch and hold your ticket, then tap Save to Photos.</p>
  <img id="save-overlay-img" alt="Your ticket">
  <button id="btn-save-done" class="btn btn-primary" type="button">Done</button>
</div>

<script src="js/config.js"></script>
<script src="js/ticket-canvas.js"></script>
<script src="js/content-filter.js"></script>
<script src="js/app.js"></script>
</body>
</html>
